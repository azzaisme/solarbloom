<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walking, keyboard and mouse</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="screen" style="width: 1280px; height: 800px">

  <section class="card hud-obj" aria-label="Objective">
    <div class="badge"><span class="ic i-pin"></span></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 18px; font-weight: 900; line-height: 1.3">Help Pylon: restore the ground round the tram stop</div>
      <div class="row" style="gap: 10px"><div class="bar grow"><i style="width: 60%"></i></div><span class="small" style="font-variant-numeric: tabular-nums">12 of 20</span></div>
    </div>
  </section>

  <section class="card hud-charge" aria-label="Charge 86 percent">
    <div class="row" style="gap: 10px; margin-bottom: 8px">
      <div class="badge sun sm"><span class="ic s i-cell"></span></div>
      <span class="h3 grow">Charge</span>
      <span class="small soft" style="font-variant-numeric: tabular-nums">86%</span>
    </div>
    <div class="bar sun" style="height: 14px"><i style="width: 86%"></i></div>
  </section>
  <div class="chip" style="position: absolute; right: 18px; top: 122px; background: rgba(255,252,243,.93); box-shadow: 0 3px 10px rgba(70,50,10,.16)"><span class="mat m-seeds" style="width: 16px; height: 16px"></span>Seeds loaded</div>

  <div class="mm" role="img" aria-label="Map around bloombot, north up">
    <svg viewBox="0 0 178 178" aria-hidden="true">
      <defs>
        <filter id="paint" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .35  0 0 0 0 .1  0 0 0 .18 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite><feBlend in2="SourceGraphic" mode="multiply"></feBlend></filter>
        <linearGradient id="arw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"></stop><stop offset="1" stop-color="#f2961c"></stop></linearGradient>
        <radialGradient id="pond" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#8fdcd2"></stop><stop offset="1" stop-color="#4fb3b6"></stop></radialGradient>
      </defs>
      <g filter="url(#paint)">
        <rect width="178" height="178" fill="#a3d36c"></rect>
        <g fill="#b8de80" opacity=".8"><circle cx="40" cy="40" r="26"></circle><circle cx="138" cy="146" r="30"></circle><circle cx="140" cy="44" r="22"></circle></g>
        <!-- paths: wide sandy lanes with a soft darker edge -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-10 62H60c14 0 22 8 22 22v104M82 84c0-26 20-40 46-40h60M82 128h58c20 0 30 10 34 30M30 62V-10M128 44V-10" stroke="#e3c896" stroke-width="20"></path>
          <path d="M-10 62H60c14 0 22 8 22 22v104M82 84c0-26 20-40 46-40h60M82 128h58c20 0 30 10 34 30M30 62V-10M128 44V-10" stroke="#f3dfb8" stroke-width="16"></path>
          <path d="M30 62c0 30-6 50-20 70M140 128v60" stroke="#e3c896" stroke-width="13"></path>
          <path d="M30 62c0 30-6 50-20 70M140 128v60" stroke="#f3dfb8" stroke-width="10"></path>
        </g>
        <!-- ponds -->
        <path d="M100 76c10-8 30-6 34 6s-4 26-18 28-28-2-30-14 6-14 14-20z" fill="#5ab9b8"></path>
        <path d="M101 79c9-7 27-5 30 6s-4 22-16 24-25-2-27-12 5-12 13-18z" fill="url(#pond)"></path>
        <ellipse cx="44" cy="150" rx="16" ry="10" fill="#5ab9b8"></ellipse><ellipse cx="44" cy="149" rx="14" ry="8.5" fill="url(#pond)"></ellipse>
        <!-- bush and tree clusters -->
        <g fill="#5d9d42"><circle cx="12" cy="30" r="9"></circle><circle cx="22" cy="20" r="8"></circle><circle cx="50" cy="32" r="8"></circle><circle cx="58" cy="44" r="6"></circle><circle cx="110" cy="20" r="9"></circle><circle cx="96" cy="26" r="7"></circle><circle cx="158" cy="70" r="9"></circle><circle cx="168" cy="82" r="8"></circle><circle cx="104" cy="150" r="10"></circle><circle cx="116" cy="160" r="8"></circle><circle cx="52" cy="104" r="8"></circle><circle cx="60" cy="116" r="6"></circle><circle cx="14" cy="96" r="7"></circle><circle cx="160" cy="112" r="7"></circle></g>
        <g fill="#7cc25a"><circle cx="10" cy="27" r="4"></circle><circle cx="20" cy="17" r="3.5"></circle><circle cx="48" cy="29" r="3.5"></circle><circle cx="108" cy="17" r="4"></circle><circle cx="156" cy="67" r="4"></circle><circle cx="102" cy="147" r="4.5"></circle><circle cx="50" cy="101" r="3.5"></circle><circle cx="158" cy="109" r="3"></circle></g>
        <!-- little buildings and kiosks -->
        <rect x="140" y="88" width="20" height="16" rx="4" fill="#f4dcb6" stroke="#d9b98a" stroke-width="1.5"></rect>
        <path d="M150 90c-4 0-6 3-6 5s3 4 6 4 6-2 6-4-2-5-6-5z" fill="#f28cb8"></path>
        <circle cx="150" cy="95" r="2" fill="#ffe27a"></circle>
        <rect x="8" y="112" width="16" height="13" rx="3" fill="#f4dcb6" stroke="#d9b98a" stroke-width="1.5"></rect>
        <rect x="11" y="114" width="10" height="5" rx="2" fill="#e98fae"></rect>
        <rect x="96" y="56" width="14" height="10" rx="3" fill="#fff4d8" stroke="#e0c89a" stroke-width="1.2"></rect>
        <circle cx="30" cy="76" r="8" fill="#efe2c6" stroke="#dcc79c" stroke-width="1.5"></circle><circle cx="30" cy="76" r="4" fill="#7fd0ec"></circle>
        <!-- flowers -->
        <g fill="#f2689f"><circle cx="66" cy="20" r="2.2"></circle><circle cx="70" cy="26" r="1.8"></circle><circle cx="120" cy="108" r="2.2"></circle><circle cx="68" cy="146" r="2.2"></circle><circle cx="160" cy="130" r="2"></circle><circle cx="40" cy="120" r="2"></circle></g>
        <g fill="#fff"><circle cx="72" cy="18" r="1.8"></circle><circle cx="124" cy="112" r="1.8"></circle><circle cx="64" cy="150" r="1.8"></circle><circle cx="44" cy="96" r="1.8"></circle></g>
        <g fill="#ffd84a"><circle cx="112" cy="70" r="2"></circle><circle cx="150" cy="150" r="2"></circle><circle cx="20" cy="140" r="1.8"></circle></g>
        <g fill="#b18ae0"><circle cx="58" cy="138" r="2"></circle><circle cx="96" cy="36" r="1.8"></circle></g>
      </g>
      <!-- bloombot -->
      <ellipse cx="89" cy="95" rx="13" ry="6" fill="rgba(30,50,10,.22)"></ellipse>
      <path d="M89 70l14 27-14-7-14 7z" fill="url(#arw)" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"></path>
      <path d="M89 70l14 27-14-7-14 7z" fill="none" stroke="#8a4a00" stroke-width="1.6" stroke-linejoin="round"></path>
    </svg>
    <span class="n">N</span>
    <span class="rim"><span class="ic s i-sun" style="color: #c98a10"></span>07:34 · Sunny</span>
  </div>

  <div class="prompt" role="status">
    <div class="main card"><span class="g">E</span>Talk to Pylon</div>
    <div class="sub card"><span class="g mouse"></span>Pulse</div>
  </div>

  <div class="toast card" style="position: absolute; right: 18px; bottom: 112px"><span class="badge sm"><span class="mat m-copper" style="width: 16px; height: 16px; border-width: 4px"></span></span>+3 Copper</div>

  <nav class="dock quiet" aria-label="Shortcuts">
    <button class="dock-b" style="background: none; border: 0; padding: 0; font: inherit" aria-label="Backpack (Tab)"><span class="round card"><span class="ic l i-pack"></span></span><span class="g wide" style="height: 26px">Tab</span><span class="dot" style="right: 2px; top: 0"></span></button>
    <button class="dock-b" style="background: none; border: 0; padding: 0; font: inherit" aria-label="Map (M)"><span class="round card"><span class="ic l i-map"></span></span><span class="g" style="height: 26px">M</span></button>
    <button class="dock-b" style="background: none; border: 0; padding: 0; font: inherit" aria-label="Menu (Esc)"><span class="round card"><span class="ic l i-menu"></span></span><span class="g wide" style="height: 26px">Esc</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
