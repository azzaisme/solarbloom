<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walking, gamepad, low charge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="screen" style="width: 1280px; height: 800px">

  <section class="card hud-obj" aria-label="Objective">
    <div class="badge sun"><span class="ic i-cell"></span></div>
    <div style="flex: 1; font-size: 18px; font-weight: 900; line-height: 1.3">Bloombot is running low. Eat something from the backpack, or walk home to rest.</div>
  </section>

  <section class="card hud-charge" aria-label="Charge 18 percent, low" style="box-shadow: 0 0 0 2.5px #f3b22a, 0 10px 28px rgba(70,50,10,.2)">
    <div class="row" style="gap: 10px; margin-bottom: 8px">
      <div class="badge sun sm"><span class="ic s i-cell"></span></div>
      <span class="h3 grow">Charge</span>
      <span class="small" style="color: #875800; font-variant-numeric: tabular-nums">Low · 18%</span>
    </div>
    <div class="bar" style="height: 14px"><i style="width: 18%; background: linear-gradient(90deg, #e9772a, #f7a542)"></i></div>
    <div class="row" style="gap: 8px; margin-top: 10px"><span class="g dpad left" style="height: 26px; width: 26px"></span><span class="small">Eat</span></div>
  </section>

  <div class="mm" role="img" aria-label="Map around bloombot, north up">
    <svg viewBox="0 0 178 178" aria-hidden="true">
      <defs>
        <filter id="paint2" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .2 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite><feBlend in2="SourceGraphic" mode="multiply"></feBlend></filter>
        <linearGradient id="arw2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"></stop><stop offset="1" stop-color="#f2961c"></stop></linearGradient>
      </defs>
      <g filter="url(#paint2)">
        <rect width="178" height="178" fill="#c27a50"></rect>
        <path d="M0 0h96c-8 26 6 46-4 72s-40 28-92 38z" fill="#a3d36c"></path>
        <path d="M160 0h18v178h-50c14-30 26-44 28-86s-6-62 4-92z" fill="#ece6da" opacity=".92"></path>
        <g fill="none" stroke-linecap="round"><path d="M-10 84h190M66-10v200" stroke="#d9b98a" stroke-width="18"></path><path d="M-10 84h190M66-10v200" stroke="#e8d3b0" stroke-width="14"></path></g>
        <g fill="#9e5e3c" opacity=".55"><path d="M100 110l14-4 6 12-12 6z"></path><path d="M20 130l16-2 2 12-14 2z"></path><path d="M120 150l10 2-2 10-10-2z"></path></g>
        <g fill="#5d9d42"><circle cx="18" cy="28" r="9"></circle><circle cx="30" cy="18" r="7"></circle><circle cx="44" cy="52" r="8"></circle></g>
        <g fill="#7cc25a"><circle cx="16" cy="25" r="4"></circle><circle cx="42" cy="49" r="3.5"></circle></g>
        <g fill="#f2689f"><circle cx="76" cy="40" r="2.2"></circle><circle cx="30" cy="66" r="2.2"></circle></g>
        <g fill="#fff"><circle cx="80" cy="44" r="1.8"></circle></g>
      </g>
      <path d="M89 70l14 27-14-7-14 7z" fill="url(#arw2)" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" transform="rotate(-30 89 86)"></path>
      <path d="M89 70l14 27-14-7-14 7z" fill="none" stroke="#8a4a00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(-30 89 86)"></path>
    </svg>
    <span class="n">N</span>
    <span class="rim"><span class="ic s i-cloud" style="color: #1a5e8b"></span>16:10 · Cloudy</span>
  </div>

  <div aria-label="Pulse load wheel" style="position: absolute; left: 50%; bottom: 150px; width: 300px; height: 230px; transform: translateX(-50%)">
    <div class="card" style="position: absolute; left: 105px; top: 0; width: 90px; height: 90px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 14px Nunito"><span class="ic i-close" style="color: #7b8574"></span>Nothing</div>
    <div class="card" style="position: absolute; left: 0; top: 70px; width: 90px; height: 90px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 14px Nunito; opacity: .55"><span class="mat m-greens" style="width: 20px; height: 20px"></span>Fertiliser</div>
    <div class="card focus" style="position: absolute; left: 210px; top: 70px; width: 90px; height: 90px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 900 14px Nunito"><span class="mat m-seeds" style="width: 20px; height: 20px"></span>Seeds</div>
    <div class="card" style="position: absolute; left: 105px; top: 140px; width: 90px; height: 90px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 14px Nunito"><span class="mat m-sunstone" style="width: 20px; height: 20px"></span>Rare seed</div>
  </div>

  <div class="prompt" role="status">
    <div class="main card"><span class="g pad px">X</span>Pulse with Seeds</div>
    <div class="sub card"><span class="g bumper">LB</span><span class="g bumper">RB</span>Change the load</div>
  </div>

  <nav class="dock quiet" aria-label="Shortcuts">
    <div class="dock-b"><span class="round card"><span class="ic l i-pack"></span></span><span class="g dpad up" style="height: 26px; width: 26px"></span></div>
    <div class="dock-b"><span class="round card"><span class="ic l i-map"></span></span><span class="g view" style="height: 26px; width: 26px">▣</span></div>
    <div class="dock-b"><span class="round card"><span class="ic l i-menu"></span></span><span class="g view" style="height: 26px; width: 26px">≡</span></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
