<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Fredoka:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="screen" style="width: 1280px; height: 800px">
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 427px; background: rgba(255, 252, 243, .42); backdrop-filter: blur(14px) saturate(1.1); border-right: 1px solid rgba(255,255,255,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 32px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div class="badge" style="width: 104px; height: 104px; background: #fffcf3; box-shadow: 0 10px 28px rgba(70,50,10,.2)"><span class="ic i-leaf" style="width: 58px; height: 58px; color: #3d9a3a"></span></div>
      <h1 style="margin: 0; font: 700 56px/1 Fredoka, Nunito, sans-serif; color: #1f2a1c; letter-spacing: .01em">Solarbloom</h1>
      <div class="body soft">Bring the island back to life</div>
    </div>
    <nav aria-label="Main menu" style="display: flex; flex-direction: column; gap: 12px; width: 280px">
      <button class="btn primary focus" style="min-height: 60px; font-size: 20px"><span class="ic i-play"></span>Play</button>
      <button class="btn" style="min-height: 52px"><span class="ic i-gear"></span>Settings</button>
      <button class="btn" style="min-height: 52px"><span class="ic i-door"></span>Quit</button>
    </nav>
  </div>
  <div class="small" style="position: absolute; right: 20px; bottom: 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5)">Early build · saves on this device</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
