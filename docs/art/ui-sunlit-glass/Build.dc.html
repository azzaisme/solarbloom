<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build mode, keyboard and mouse</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="screen" style="width: 1280px; height: 800px">
  <div style="position: absolute; inset: 0; background: rgba(40, 60, 80, .28)"></div>
  <div style="position: absolute; left: 560px; top: 380px; width: 170px; height: 80px; border-radius: 50%; background: rgba(255, 238, 120, .35); border: 3px solid #ffe066; box-shadow: 0 0 30px rgba(255, 224, 80, .7)"></div>
  <div class="crosshair"></div>

  <section class="card hud-charge" aria-label="Charge 86 percent">
    <div class="row" style="gap: 10px; margin-bottom: 8px">
      <div class="badge sun sm"><span class="ic s i-cell"></span></div>
      <span class="h3 grow">Charge</span>
      <span class="small soft">86%</span>
    </div>
    <div class="bar sun" style="height: 14px"><i style="width: 86%"></i></div>
  </section>

  <div class="card" style="position: absolute; left: 18px; top: 18px; padding: 10px 16px 10px 10px; border-radius: 999px; display: flex; align-items: center; gap: 10px">
    <div class="badge sun sm"><span class="ic s i-bolt"></span></div><span class="h3">Power view</span><span class="small soft">Lit lines carry power</span>
  </div>

  <div class="prompt" style="bottom: 150px" role="status">
    <div class="main card"><span class="g mouse"></span>Build a Solar Panel</div>
    <div class="sub card" style="padding-right: 8px"><span class="g">R</span>Turn<span style="width: 10px"></span><span class="chip ok"><span class="mat m-timber" style="width: 16px; height: 16px"></span>2 of 2 Timber</span><span class="chip ok"><span class="mat m-glass" style="width: 16px; height: 16px"></span>1 of 1 Glass</span></div>
  </div>

  <nav class="card bdock" aria-label="Build hotbar">
    <div class="mode"><span class="round"><span class="ic i-drop" style="color: #1a5e8b"></span></span>Water<span class="g" style="height: 24px">V</span></div>
    <div class="mode on"><span class="round"><span class="ic i-bolt"></span></span>Power<span class="g" style="height: 24px">O</span></div>
    <span class="vsep"></span>
    <div class="bslot on"><span class="ic l i-solar" style="color: #875800"></span>Solar<span class="g">1</span></div>
    <div class="bslot"><span class="ic l i-cell" style="color: #875800"></span>Battery<span class="g">2</span></div>
    <div class="bslot"><span class="ic l i-bolt" style="color: #875800"></span>Pole<span class="g">3</span></div>
    <div class="bslot"><span class="ic l i-sprout" style="color: #29722a"></span>Planter<span class="g">4</span></div>
    <div class="bslot"><span class="mat m-compost"></span>Compost<span class="g">5</span></div>
    <div class="bslot"><span class="ic l i-drop" style="color: #1a5e8b"></span>Pump<span class="g">6</span><span class="dot" style="right: 6px; top: 6px"></span></div>
    <div class="bslot" style="opacity: .6"><span class="ic l i-lock"></span>Pipe<span class="g">7</span></div>
    <div class="bslot empty">Empty<span class="g">8</span></div>
    <span class="vsep"></span>
    <div class="mode"><span class="round"><span class="ic i-remove" style="color: #a23d1c"></span></span>Remove<span class="g" style="height: 24px">X</span></div>
    <div class="mode"><span class="round"><span class="ic i-hammer"></span></span>All builds<span class="g" style="height: 24px">Q</span></div>
  </nav>
  <div class="acts on-scene" style="position: absolute; right: 22px; bottom: 132px"><span class="act"><span class="g wide">Esc</span>Stop building</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
