name: Build
# Builds only (typecheck + production bundle). Tests run locally, not on GitHub Actions.
on:
  push:
    branches: [main, testing]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: solarbloom-dist
          path: dist
