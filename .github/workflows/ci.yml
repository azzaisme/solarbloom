name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      - run: npm run test:soak
  browser-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run test:perf:browser
      - run: npm run test:e2e
      - run: STRICT=1 node tests/e2e/phase4-hud.e2e.mjs
      - run: node tests/e2e/phase4-session.e2e.mjs
