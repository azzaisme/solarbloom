name: Steam Deck release
# Runs when `testing` is merged into `main` (any push to main), or by hand from the Actions tab.
# Builds the game, wraps it with Electron as a Linux AppImage (what a Steam Deck runs) and publishes it as a
# GitHub release. Tests run locally, not on GitHub Actions (see ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: steamdeck-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version this build
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          version="$base-build.${{ github.run_number }}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Typecheck and build the game
        run: npm run build
      - name: Package the AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: solarbloom-steamdeck
          path: release/*.AppImage
          if-no-files-found: error
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" release/*.AppImage \
            --target "${{ github.sha }}" \
            --title "Solarbloom ${{ steps.version.outputs.version }} (Steam Deck)" \
            --notes "Steam Deck build of commit ${{ github.sha }}. To install: download the AppImage on the Deck in Desktop Mode, mark it executable (Properties > Permissions), then add it to Steam with Games > Add a Non-Steam Game."
