name: Steam Deck release
# Runs when `testing` is merged into `main` (any push to main), or by hand from the Actions tab.
# Builds the game, wraps it with Electron as a Linux AppImage (what a Steam Deck runs) and publishes it as a
# GitHub release. Tests run locally, not on GitHub Actions (see ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: steamdeck-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # "0.1.<build>": a plain number, so in-game updates (electron-updater) compare builds simply and look for
      # latest-linux.yml (a "-build.N" suffix would put them on a separate "build" channel). It sorts after the old
      # "0.1.0-build.N" releases, so those installs see it as newer.
      - name: Version this build
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Typecheck and build the game
        run: npm run build
      - name: Package the AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: solarbloom-steamdeck
          path: release/*.AppImage
          if-no-files-found: error
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest-linux.yml is what the game's updater reads to find this build
          test -f release/latest-linux.yml || { echo "release/latest-linux.yml missing: in-game updates need it"; exit 1; }
          gh release create "v${{ steps.version.outputs.version }}" release/*.AppImage release/latest-linux.yml tools/steamdeck/add-to-steam.sh \
            --target "${{ github.sha }}" \
            --title "Solarbloom ${{ steps.version.outputs.version }} (Steam Deck)" \
            --notes "Steam Deck build of commit ${{ github.sha }}. Games installed from this release on update themselves (the title screen shows the version). First install: on the Deck in Desktop Mode, download both files and run: bash ~/Downloads/add-to-steam.sh ~/Downloads/Solarbloom-*-steamdeck.AppImage (details in docs/STEAM_DECK.md)."
